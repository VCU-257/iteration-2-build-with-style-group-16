<script>
  function getCart(){
    return JSON.parse(localStorage.getItem("cart")) || [];

  }

  function saveCart(cart){
     localStorage.setItem("cart", JSON.stringify(cart));
  }
  function seedCartIfEmpty() {
    const existing = getCart();

    if (existing.length === 0) {
      const seed = [
        { id: "68094", name: "Rose Flower Bouquet", price: 75, count: 4 },
        { id: "55664", name: "Sunflower Gather", price: 30, count: 9 },
        { id: "23867", name: "Blue Vibes Bouquet", price: 45, count: 1 }
      ];

      saveCart(seed);
    }
  }

  function renderCart() {
    const cartBody = document.getElementById("cartBody");
    const cart = getCart();

    cartBody.innerHTML = "";

    cart.forEach(item => {
      const row = document.createElement("tr");

      row.innerHTML = `
        <th scope="row">${item.count}</th>
        <td>${item.name}</td>
        <td>$${item.price}</td>
        <td>${item.id}</td>
        <td>
          <button class="btn btn-sm btn-danger btn-remove" onclick="removeItem('${item.id}')">
             <i class="bi bi-trash"></i>
          </button>
        </td>
      `;

      cartBody.appendChild(row);
    });
  }

  function removeItem(id) {
    let cart = getCart();
    cart = cart.filter(item => item.id !== id);
    saveCart(cart);
    renderCart();
  }

  document.addEventListener("DOMContentLoaded", () => {
  seedCartIfEmpty();
  renderCart();
  });
</script>
